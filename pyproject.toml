[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seslinot"
version = "0.1.0"
description = "Yerel GPU sesli not yakalama ve çok-ajanlı derin araştırma sistemi (Obsidian / Hafıza OS uyumlu)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
    "httpx>=0.27.2",
    "trafilatura>=2.0.0",
    "rapidfuzz>=3.9.0",
]

[project.optional-dependencies]
vad = [
    "onnxruntime>=1.19.0",
    "numpy>=2.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
seslinot = "seslinot.cli:main"
seslinotd = "seslinot.desktop.daemon:main"
seslinot-ctl = "seslinot.cli:ctl_main"

[tool.hatch.build.targets.wheel]
packages = ["src/seslinot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
