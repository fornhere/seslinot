[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seslinot"
version = "0.3.0"
description = "Linux, macOS ve Windows için sesli not yakalama ve doğrulanmış kaynaklı çok-ajanlı derin araştırma sistemi (Obsidian & opsiyonel Hafıza OS uyumlu)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Forn", email = "178168387+fornhere@users.noreply.github.com" },
]
keywords = [
    "obsidian",
    "voice-notes",
    "whisper",
    "deep-research",
    "multi-agent",
    "ai-agents",
    "turkish",
    "omarchy",
    "hyprland",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: News/Diary",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.9.0",
    "httpx>=0.27.2",
    "trafilatura>=2.0.0",
    "rapidfuzz>=3.9.0",
    "starlette>=0.41.0",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
desktop = [
    "sounddevice>=0.5.0",
    "pystray>=0.19.5",
    "pillow>=10.0.0",
    "pynput>=1.7.7",
]
vad = [
    "onnxruntime>=1.19.0",
    "numpy>=2.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/fornhere/seslinot"
Repository = "https://github.com/fornhere/seslinot"
Issues = "https://github.com/fornhere/seslinot/issues"

[project.scripts]
seslinot = "seslinot.cli:main"
seslinotd = "seslinot.desktop.daemon:main"
seslinot-ctl = "seslinot.cli:ctl_main"

[tool.hatch.build.targets.wheel]
packages = ["src/seslinot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
