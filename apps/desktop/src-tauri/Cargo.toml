[package]
name = "seslinot-desktop"
version = "0.3.0"
description = "SesliNot — Sesli not yakalama ve doğrulanmış kaynaklı çok-ajanlı derin araştırma masaüstü uygulaması"
authors = ["Forn"]
license = "MIT"
repository = "https://github.com/fornhere/seslinot"
edition = "2021"

[lib]
name = "seslinot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
